name: Test Generation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5' # Weekdays at 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_2 }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run backlog test generation
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          GH_PAT_2: ${{ secrets.GH_PAT_2 }}
          GH_TOKEN: ${{ secrets.GH_PAT_2 }}
        run: |
          agent -p --force --trust --output-format text \
            "Work in Backlog mode per .cursor/rules/qa-orchestration.mdc: query DS tickets In Progress without the tests-generated label; for each ticket (budget 5), analyze with jira-ticket-to-gherkin, delegate to test-writer to write a conforming spec under tests/, run npx playwright test, open a PR linked to the ticket, add the tests-generated label. Stop and move on after an identical spec failure twice on one ticket. Never merge or close."

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
